name: Release

# Every version (including hotfixes) gets a GitHub release with a Windows .exe and a Linux .AppImage test build
# attached (guidelines G-25 and G-26). Notes come from progress.md.
#
# Releasing = bumping `__version__` in mpro/__init__.py on main. When a push to main carries a version that has
# no release yet, this workflow builds the test builds, creates the tag vX.Y.Z on that commit and publishes the
# release. Pushing a vX.Y.Z tag yourself works too.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and re-upload even if the release already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('mpro/__init__.py').read()).group(1))")
          tag="v$v"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "$tag" ]; then
            echo "Tag ${{ github.ref_name }} does not match version $v"; exit 1
          fi
          release=true
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 && [ "${{ inputs.force }}" != "true" ]; then
            echo "Release $tag already exists; nothing to do."; release=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  web:
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.release == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: mpro/static/app

  windows:
    runs-on: windows-latest
    needs: [plan, web]
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: mpro/static/app
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen --group build --python 3.12
      - run: uv run pyinstaller --noconfirm --clean packaging/mpro.spec
      - name: Smoke test the .exe
        shell: pwsh
        run: |
          $env:MPRO_DATA_DIR = "$env:RUNNER_TEMP\mpro-smoke"
          $p = Start-Process -FilePath dist\MaintenancePro.exe -ArgumentList "--no-browser","--port=8099" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { if ((Invoke-WebRequest http://127.0.0.1:8099/healthz -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 2
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Write-Error "Test build did not start"; exit 1 }
      - name: Rename
        shell: bash
        run: mv dist/MaintenancePro.exe "dist/MaintenancePro-${TAG#v}-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  linux:
    runs-on: ubuntu-22.04  # older glibc so the AppImage runs on more distributions
    needs: [plan, web]
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: mpro/static/app
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen --group build --python 3.12
      - run: packaging/build_appimage.sh "${TAG#v}"
      - name: Smoke test the AppImage
        run: |
          export MPRO_DATA_DIR="$RUNNER_TEMP/mpro-smoke"
          f=packaging/out/MaintenancePro-${TAG#v}-x86_64.AppImage
          chmod +x "$f"
          "$f" --appimage-extract-and-run --no-browser --port=8099 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8099/healthz && break; sleep 2; done
          curl -sf http://127.0.0.1:8099/healthz
          kill %1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: packaging/out/*.AppImage

  release:
    runs-on: ubuntu-latest
    needs: [plan, windows, linux]
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: python3 scripts/release_notes.py "${TAG#v}" "${{ github.repository }}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Maintenance Pro ${{ env.TAG }}
          body_path: notes.md
          prerelease: ${{ startsWith(env.TAG, 'v0.') }}
          files: |
            assets/*.exe
            assets/*.AppImage
