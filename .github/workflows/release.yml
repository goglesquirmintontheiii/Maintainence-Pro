name: Release

# Every version tag (vX.Y.Z, including hotfixes) produces a GitHub release with a Windows .exe and a
# Linux .AppImage test build attached (guidelines G-25 and G-26). Notes come from progress.md.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Tag matches mpro.__version__
        run: |
          v=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('mpro/__init__.py').read()).group(1))")
          test "v$v" = "$TAG" || { echo "Tag $TAG does not match version $v"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: mpro/static/app

  windows:
    runs-on: windows-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: mpro/static/app
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen --group build --python 3.12
      - run: uv run pyinstaller --noconfirm --clean packaging/mpro.spec
      - name: Smoke test the .exe
        shell: pwsh
        run: |
          $env:MPRO_DATA_DIR = "$env:RUNNER_TEMP\mpro-smoke"
          $p = Start-Process -FilePath dist\MaintenancePro.exe -ArgumentList "--no-browser","--port=8099" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { if ((Invoke-WebRequest http://127.0.0.1:8099/healthz -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 2
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Write-Error "Test build did not start"; exit 1 }
      - name: Rename
        shell: bash
        run: mv dist/MaintenancePro.exe "dist/MaintenancePro-${TAG#v}-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  linux:
    runs-on: ubuntu-22.04  # older glibc so the AppImage runs on more distributions
    needs: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: mpro/static/app
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen --group build --python 3.12
      - run: packaging/build_appimage.sh "${TAG#v}"
      - name: Smoke test the AppImage
        run: |
          export MPRO_DATA_DIR="$RUNNER_TEMP/mpro-smoke"
          f=packaging/out/MaintenancePro-${TAG#v}-x86_64.AppImage
          chmod +x "$f"
          "$f" --appimage-extract-and-run --no-browser --port=8099 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8099/healthz && break; sleep 2; done
          curl -sf http://127.0.0.1:8099/healthz
          kill %1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: packaging/out/*.AppImage

  release:
    runs-on: ubuntu-latest
    needs: [windows, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: python3 scripts/release_notes.py "${TAG#v}" "${{ github.repository }}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Maintenance Pro ${{ env.TAG }}
          body_path: notes.md
          prerelease: ${{ startsWith(env.TAG, 'v0.') }}
          files: |
            assets/*.exe
            assets/*.AppImage
