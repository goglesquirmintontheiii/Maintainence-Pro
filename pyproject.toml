[project]
name = "maintenance-pro"
description = "Maintenance Pro (MPro): a self-hosted CMMS built as a drop-in replacement for MaintainX."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dynamic = ["version"]
dependencies = [
    "apiflask>=2.3",
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.0",
    "flask-login>=0.6.3",
    "sqlalchemy>=2.0.30",
    "argon2-cffi>=23.1",
    "psycopg[binary]>=3.2",
    "waitress>=3.0",
    "platformdirs>=4.2",
    "python-dotenv>=1.0",
    "pillow>=13.0.0",
    "reportlab>=5.0.1",
    "segno>=1.6.6",
    "python-dateutil==2.9.0.post0",
    "mammoth>=1.9",
    "nh3>=0.2.18",
    "openpyxl>=3.1.5",
    "pypdf==6.1.3",
]

[project.optional-dependencies]
server = ["gunicorn>=22.0"]

[project.scripts]
mpro = "mpro.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "playwright>=1.48",
]
build = ["pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "mpro/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["mpro"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "UP046", "UP047"]

[tool.mypy]
python_version = "3.12"
packages = ["mpro"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
